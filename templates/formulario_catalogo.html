{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<h1>{{ 'Editar registro' if editando else 'Nuevo registro' }} – {{ titulo }}</h1><p class="subtitle">Completa los datos del catálogo.</p>
<div class="table-container"><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid">
{% for campo, etiqueta, limite in campos %}<div><label for="{{ campo }}">{{ etiqueta }}</label><input id="{{ campo }}" name="{{ campo }}" type="{{ 'email' if campo == 'correo' else 'text' }}" maxlength="{{ limite }}" value="{{ valores[campo] }}" {% if campo == 'nombre' %}required{% endif %}></div>{% endfor %}
</div><div class="actions"><button class="btn btn-green">Guardar</button><a class="btn btn-gray" href="{{ url_for('catalogo', tipo=tipo) }}">Cancelar</a></div></form></div>
{% endblock %}
