<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudStock | {% block title %}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/fase5.css') }}">
</head>
<body>
<aside class="sidebar">
<h2>📦 CloudStock</h2>
<nav>
<a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' else '' }}">Dashboard</a>
<a href="{{ url_for('productos') }}" class="{{ 'active' if request.endpoint in ['productos','formulario_producto'] else '' }}">Productos</a>
<a href="{{ url_for('catalogo', tipo='categorias') }}" class="{{ 'active' if request.view_args and request.view_args.get('tipo') == 'categorias' else '' }}">Categorías</a>
<a href="{{ url_for('catalogo', tipo='proveedores') }}" class="{{ 'active' if request.view_args and request.view_args.get('tipo') == 'proveedores' else '' }}">Proveedores</a>
<a href="{{ url_for('inventario') }}" class="{{ 'active' if request.endpoint == 'inventario' else '' }}">Inventario</a>
<a href="{{ url_for('ventas') }}" class="{{ 'active' if request.endpoint in ['ventas','detalle_venta'] else '' }}">Ventas</a>
{% if current_user.rol == 'administrador' %}<a href="{{ url_for('reportes') }}" class="{{ 'active' if request.endpoint == 'reportes' else '' }}">Reportes</a>{% endif %}
</nav>
<form action="{{ url_for('logout') }}" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<button class="logout">Cerrar sesión</button>
</form>
</aside>
<main class="main-content">
{% for category, message in get_flashed_messages(with_categories=true) %}<div class="message {{ category }}">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
</body>
</html>
