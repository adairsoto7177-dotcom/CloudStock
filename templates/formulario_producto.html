{% extends "base.html" %}

{% block title %}Formulario de producto{% endblock %}

{% block content %}

<h1>
    {{ "Editar producto" if producto else "Registrar nuevo producto" }}
</h1>

<p class="subtitle">
    Completa la información del producto.
</p>

<div class="table-container">

    <form method="POST">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token }}">

        <div class="form-grid">

            <div>
                <label>Código del producto</label>

                <input type="text"
                       name="codigo"
                       maxlength="50"
                       value="{{ producto.codigo if producto else '' }}"
                       required>
            </div>

            <div>
                <label>Nombre del producto</label>

                <input type="text"
                       name="nombre"
                       maxlength="150"
                       value="{{ producto.nombre if producto else '' }}"
                       required>
            </div>

            <div>
                <label>Categoría</label>

                <select name="categoria" required>

                    {% for c in categorias %}

                        <option value="{{ c.id_categoria }}"
                            {% if producto and producto.id_categoria == c.id_categoria %}
                                selected
                            {% endif %}>

                            {{ c.nombre }}

                        </option>

                    {% endfor %}

                </select>
            </div>

            <div>
                <label>Proveedor</label>

                <select name="proveedor">

                    <option value="">Sin proveedor</option>

                    {% for p in proveedores %}

                        <option value="{{ p.id_proveedor }}"
                            {% if producto and producto.id_proveedor == p.id_proveedor %}
                                selected
                            {% endif %}>

                            {{ p.nombre }}

                        </option>

                    {% endfor %}

                </select>
            </div>

            <div>
                <label>Precio de compra</label>

                <input type="number"
                       name="precio_compra"
                       min="0"
                       step="0.01"
                       value="{{ producto.precio_compra if producto else '' }}"
                       required>
            </div>

            <div>
                <label>Precio de venta</label>

                <input type="number"
                       name="precio_venta"
                       min="0"
                       step="0.01"
                       value="{{ producto.precio_venta if producto else '' }}"
                       required>
            </div>

            <div>
                <label>Stock mínimo</label>

                <input type="number"
                       name="stock_minimo"
                       min="0"
                       value="{{ producto.stock_minimo if producto else 5 }}"
                       required>
            </div>

            <div>
                <label>Stock actual</label>

                <input type="number"
                       value="{{ producto.stock if producto else 0 }}"
                       disabled>
            </div>

        </div>

        <label>Descripción</label>

        <textarea name="descripcion"
                  rows="4">{{ producto.descripcion or '' if producto else '' }}</textarea>

        <div class="actions">

            <button type="submit"
                    class="btn btn-green">
                Guardar producto
            </button>

            <a href="{{ url_for('productos') }}"
               class="btn btn-gray">
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
